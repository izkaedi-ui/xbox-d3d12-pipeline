name: VMAX IR Harvest and HuggingFace Sync
on:
  workflow_dispatch:
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install huggingface_hub
      - name: Push corpus to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              folder_path="corpus",
              repo_id="zkaedi/zcc-ir-prime-v1",
              repo_type="dataset",
              path_in_repo="vmax_harvest",
              commit_message="VMAX manual harvest push",
          )
          print("Done.")
          PYEOF
